[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-ai-triage-lab"
version = "0.3.0"
description = "Bounded attack-surface observation and synthetic AI security triage evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0", "jinja2>=3.1,<4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]
pyrit = ["pyrit==1.1.0"]

[project.scripts]
asm-lite = "asm_lite.cli:main"
ai-triage-lab = "ai_triage_lab.cli:main"
ai-triage-experiment = "ai_triage_lab.experiment:main"

[tool.setuptools.packages.find]
include = ["asm_lite*", "ai_triage_lab*"]
namespaces = true

[tool.setuptools.package-data]
asm_lite = ["templates/*.j2"]
ai_triage_lab = ["data/scenarios/*.json", "data/fixtures/*.json", "data/fixtures/asm-example/*.json"]
