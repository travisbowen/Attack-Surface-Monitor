name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ai_triage_lab.cli run --out out/ci-lab
      - uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.os }}
          path: out/ci-lab
  pyrit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pyrit.txt
      - run: python -m pytest tests/ai_triage_lab -q
      - run: python -m ai_triage_lab.pyrit_demo
