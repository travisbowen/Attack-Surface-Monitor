name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m build --outdir out/release
      - name: Verify source archive companions and frozen pilot evidence
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys, tarfile
          repo = pathlib.Path.cwd()
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-verification'
          work.mkdir()
          archive = next((repo / 'out/release').glob('*.tar.gz'))
          with tarfile.open(archive) as source:
              source.extractall(work, filter='data')
          source_root, = work.iterdir()
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
                          'tests/test_external_agent_transport.py',
                          'tests/ai_triage_lab/test_external_agent.py',
                          'tests/test_pilot_bundle_portability.py'], cwd=source_root, check=True)
          subprocess.run([sys.executable, 'research/astra-runtime-pilot/verify_bundle.py'],
                         cwd=source_root, check=True)
      - name: Verify installed wheel outside checkout
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys, venv
          repo = pathlib.Path.cwd()
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installed-wheel'
          work.mkdir()
          environment = work / 'venv'
          venv.EnvBuilder(with_pip=True).create(environment)
          python = environment / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          wheel = next((repo / 'out/release').glob('*.whl'))
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
          subprocess.run([str(python), '-I', str(repo / 'scripts/verify_installed.py')], cwd=work, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.python }}
          path: out/release
      - uses: actions/upload-artifact@v4
        with:
          name: installed-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/installed-wheel/lab
            ${{ runner.temp }}/installed-wheel/dashboard
            ${{ runner.temp }}/installed-wheel/scanner
            ${{ runner.temp }}/installed-wheel/preflight
            ${{ runner.temp }}/installed-wheel/wheel-verification.json
      - name: Remove disposable verification environments
        if: always()
        shell: python {0}
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          for name in ('installed-wheel', 'source-verification'):
              target = root / name
              if target.exists():
                  assert target.resolve().parent == root
                  shutil.rmtree(target)
  pyrit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,pyrit]"
      - run: python -m pytest tests/ai_triage_lab -q
      - run: python -m ai_triage_lab.pyrit_demo
